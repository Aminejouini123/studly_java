
# ─────────────────────────────────────────────────────────
#  Studly – Recommendation Service API Configuration
# ─────────────────────────────────────────────────────────
#
#  Adzuna (Job listings)
#    1. Register at https://developer.adzuna.com/
#    2. Create an application → copy App ID and App Key below
#
adzuna.app.id=YOUR_ADZUNA_APP_ID_HERE
adzuna.app.key=YOUR_ADZUNA_APP_KEY_HERE
#
#  YouTube Data API v3 (Course recommendations)
#    1. Go to https://console.developers.google.com/
#    2. Create project → Enable "YouTube Data API v3"
#    3. Credentials → Create API Key → copy it below
#
youtube.api.key=YOUR_YOUTUBE_API_KEY_HERE